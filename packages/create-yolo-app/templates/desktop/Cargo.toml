[package]
name = "{{NAME}}"
version = "0.1.0"
edition = "2024"
description = "Cross-platform Desktop Application with Dioxus 0.8 / WGPU 3D Analytical SDF Rendering"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
wgpu = "24.0"
bytemuck = { version = "1.19", features = ["derive"] }
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"

[[bin]]
name = "{{NAME}}"
path = "src/main.rs"
