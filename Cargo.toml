[package]
name = "yolo-standards"
version = "0.1.0"
edition = "2024"
description = "Zero-HTML/CSS/JS standards schemas and validator bindings in Pure Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.37", features = ["serialize"] }
thiserror = "2.0"

[lib]
name = "yolo_standards"
path = "src/lib.rs"
