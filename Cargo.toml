[package]
name = "yolo-standards"
version = "0.1.0"
edition = "2024"
description = "Zero-HTML/CSS/JS standards schemas and validator bindings in Pure Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[lib]
name = "yolo_standards"
path = "src/lib.rs"

[workspace]
members = ["crates/yolo-posix", "crates/yolo-coreutils-wasm"]
resolver = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
strip = "symbols"
