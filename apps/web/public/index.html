<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>YOLO ARENA 2026</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }
    #game-container {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #020408;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    /* Minimalist HUD overlay */
    #hud-overlay {
      position: absolute;
      top: 16px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-chip {
      background: rgba(10, 15, 26, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }
    .mode-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .mode-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .mode-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.5);
    }
    #quick-controls {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(10, 15, 26, 0.7);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 11px;
      color: #64748b;
      display: flex;
      gap: 16px;
      pointer-events: none;
      z-index: 10;
    }
    #quick-controls span {
      color: #cbd5e1;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="game-canvas"></canvas>

    <div id="hud-overlay">
      <div class="hud-chip">
        <button id="btn-mode-1" class="mode-btn active">1 · CHROMIUM V8</button>
        <button id="btn-mode-2" class="mode-btn">2 · TUX SOULS 3D</button>
        <button id="btn-mode-3" class="mode-btn">3 · MARIO 64 WIN</button>
        <button id="btn-mode-4" class="mode-btn">4 · SKIA BENCH</button>
      </div>

      <div class="hud-chip" id="hud-stats">
        <span id="fps-counter" style="color: #34d399;">120 FPS</span>
        <span style="color: #475569;">|</span>
        <span id="score-counter" style="color: #38bdf8;">SCORE 0</span>
        <span style="color: #475569;">|</span>
        <span id="hp-counter" style="color: #f87171;">HP 100</span>
      </div>
    </div>

    <div id="quick-controls">
      <div><span>[ESPACE]</span> / <span>[A]</span> SAUT</div>
      <div><span>[F]</span> / <span>[B]</span> ATTAQUE WEBGPU</div>
      <div><span>[1-4]</span> CHANGER DE MONDE</div>
      <div><span>[F11]</span> PLEIN ÉCRAN</div>
    </div>
  </div>

  <script type="module" src="./client.ts"></script>
</body>
</html>
